<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StudSpace — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    const _t = localStorage.getItem('ss-theme');
    if (_t === 'dark' || (!_t && matchMedia('(prefers-color-scheme: dark)').matches))
      document.documentElement.classList.add('dark');
    const _a = localStorage.getItem('ss-accent');
    if (_a) document.documentElement.style.setProperty('--accent', _a);
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>

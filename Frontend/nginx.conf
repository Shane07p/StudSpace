# Reuse backend connections instead of opening a new TCP connection per request
# (avoids connection churn → 502s under load).
upstream backend {
    server studspace-backend:8080;
    keepalive 64;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    sendfile off;

    client_max_body_size 30M;

    # Compress text/JSON responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain application/xml;

    # Prevent caching of all files to ensure updates are seen immediately
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    add_header Pragma "no-cache";
    add_header Expires "0";

    # Security headers
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Proxy API, OAuth, and login callbacks to the backend container
    location /api/ {
        proxy_pass         http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection         "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /oauth2/ {
        proxy_pass         http://backend/oauth2/;
        proxy_http_version 1.1;
        proxy_set_header   Connection         "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /login/ {
        proxy_pass         http://backend/login/;
        proxy_http_version 1.1;
        proxy_set_header   Connection         "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

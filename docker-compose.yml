services:
  db:
    image: postgres:16-alpine
    container_name: studspace-db
    environment:
      POSTGRES_DB: studspace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d studspace"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: studspace-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://studspace-db:5432/studspace
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1zdHVkc3BhY2UtYXBwLTIwMjQ=}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-your-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-your-google-client-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: studspace-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
